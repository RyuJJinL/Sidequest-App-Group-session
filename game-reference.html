<!doctype html><html lang="en"><meta charset="utf-8"><title>Recovered game character · private comparison</title><style>body{margin:0;background:#10251f;color:#eee6d4;font:16px system-ui}main{max-width:900px;margin:auto;padding:20px}canvas{display:block;width:480px;max-width:100%;background:#1b382d;border-radius:20px}label{display:inline-flex;gap:8px;margin:10px}select,button,input{font:inherit}p{max-width:70ch}</style><main><h1>Recovered game character</h1><p id="status">Loading…</p><p>Actual Pocket Life World character art and weighted rig. Badminton is a newly authored adaptation; this package contains no original badminton clip.</p><label>Mode<select id="mode"><option value="badminton">Badminton · new adaptation</option><option value="original">Original game animation</option></select></label><label>Original clip<select id="clip"></select></label><button id="play">Pause</button><label>Seconds<input type="number" id="time" value="0" step=".1"></label><canvas id="game" width="600" height="700"></canvas></main><script type="module">import{mountGameReference}from'./src/game-reference.mjs';const $=s=>document.querySelector(s);let time=0,last,play=true;try{const player=await mountGameReference($('#game'),{onStatus:s=>$('#status').textContent=s});for(const clip of player.clips){const o=document.createElement('option');o.value=clip.name;o.textContent=clip.label;$('#clip').append(o)}$('#clip').value='待机动画/待机';$('#play').onclick=()=>{play=!play;$('#play').textContent=play?'Pause':'Play'};$('#time').oninput=()=>{time=+$('#time').value};function frame(now){if(last&&play)time+=(now-last)/1000;last=now;player.draw(time,{mode:$('#mode').value,clip:$('#clip').value});if(play)$('#time').value=time.toFixed(1);requestAnimationFrame(frame)}requestAnimationFrame(frame)}catch(e){$('#status').textContent=e.message;console.error(e)}</script></html>
